name: ci

on:
  workflow_dispatch:
  push:
    branches: ['neon_bot_docker']

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: git clone https://github.com/Nubuki-all/neon_bot/

      - name: Set arch tag
        run: echo "ARCH=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: neon_bot
          platforms: ${{ matrix.platform }}
          push: true
          tags: colserra/neon_bot_docker:${{ env.ARCH }}
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t colserra/neon_bot_docker:latest \
            -t colserra/neon_bot_docker:${{ steps.date.outputs.date }} \
            colserra/neon_bot_docker:linux-amd64 \
            colserra/neon_bot_docker:linux-arm64
      - name: Delete per-arch tags
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          for tag in linux-amd64 linux-arm64; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/colserra/neon_bot_docker/tags/$tag/")
            echo "deleted $tag -> HTTP $code"
          done
